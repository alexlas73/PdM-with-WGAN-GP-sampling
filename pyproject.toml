[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ftaa"
version = "2.0.0"
description = "Evaluation pipeline for failure-type-aware generative augmentation on AI4I 2020"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Dependencies are pinned in requirements.txt (experiment) and requirements-analysis.txt (analysis, tests).

[tool.setuptools]
packages = ["ftaa"]
